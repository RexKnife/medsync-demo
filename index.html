 ['A review is the entry point','POST /reviews HTTP/1.1\nContent-Type: application/json\n\n'+JSON.stringify({product:'consultation-portal',rating:5,review:sampleReview},null,2),'User input is data. The dangerous transition happens later, when another browser interprets stored data as HTML.','Unprivileged author → application input','Slides 4–5 · Entry point and stored-XSS trap'],
 ['The request reaches the review handler','request.user = "ordinary-user-17"\nrequest.body.review = [image markup]\n\nAuthentication: ordinary account accepted\nValidation: rating and text length checked\nHTML event attributes: not neutralized','A successful login and valid JSON do not make the contents safe to render. The payload persists beyond this request.','Client data → server processing','Slides 4–5 · Data versus code'],
 ['The trap persists in storage',JSON.stringify({review_id:'RV-208',author_id:'ordinary-user-17',review_text:sampleReview,created_at:'2026-11-01T09:00:00+08:00'},null,2)+'\n\nHTTP/1.1 201 Created','Stored XSS does not need a special link for each victim: a later viewer encounters the saved review. Storing raw text is not itself execution; unsafe output handling creates that boundary crossing.','Review handler → database row RV-208','Slide 5 · Phase 1: planting the trap'],
 ['A different user loads the saved review','GET /moderation/reviews/RV-208 HTTP/1.1\nSession: admin-01\n\nDatabase lookup: RV-208\nAuthor: ordinary-user-17\nViewer: admin-01','The attacker and victim are different users. The viewer has a session the attacker wants, even though that viewer should not be allowed to read clinical records.','Stored attacker data → victim page','Slide 6 · Phase 2: token theft'],
 ['The response crosses into the browser','HTTP/1.1 200 OK\nContent-Type: text/html\n\n<div class="review">\n  '+sampleReview+'\n</div>\n\nVulnerable sink: reviewElement.innerHTML = savedReview','The application embeds review content in an HTML context. An image with a missing source can fire an event handler. A filter that only removes script tags misses this mechanism.','Database text → HTML parser','Slides 5–6 · Stored XSS, CWE-79'],
 ['The browser gives injected code the app’s origin','Simulated event sequence:\n1. Create image element\n2. Image fails to load\n3. Run onerror in portal origin\n4. Read localStorage["medsync_token"]\n5. Send copied value to local collector','The browser does not label the handler as an attacker. It runs with the page’s origin privileges. This is stored XSS; reflected and DOM-based XSS have different entry paths.','Untrusted review → trusted script privileges','Slide 6 · Phase 2: localStorage exposure'],
 ['The copied session identifies the victim',JSON.stringify({header:{alg:'HS256',typ:'JWT'},claims,signature:'SIMULATED_SIGNATURE'},null,2),'JWTs have header.payload.signature. Claims are readable, not secret. The attacker replays an existing identity; this chain does not require cracking a key or forging a signature.','Victim session → attacker possession','Slide 6 · Token theft and replay'],
 ['The client reuses the copied credential','GET /api/records/42 HTTP/1.1\nAuthorization: Bearer '+demoJWT+'\n\nThen: GET /api/records/1\nAuthorization: Bearer [same copied session]','The signature may be perfectly valid. The credential was stolen after login. Individual patient access illustrates BOLA; unrestricted bulk export also lacks a collection-level permission check.','Attacker request → authenticated API','Slide 7 · Phase 3: BOLA and mass disclosure'],
 ['Identity verification passes','verifySignature(token) → PASS (simulated)\nvalidateExpiry(token.exp) → PASS (simulated)\nrequest.user → admin-01\n\nQuestion answered: Who is calling?\nQuestion still open: May they read patient 42?','Authentication and authorization are separate decisions. A valid admin identity does not imply permission to access a patient’s medical record.','Verified identity → authorization decision','Slides 7–8 · Authentication versus authorization'],
 ['The object ownership check is missing','VULNERABLE\nSELECT * FROM records WHERE id = 42;\n\nPATCHED PATIENT-OWNED EXAMPLE\nSELECT * FROM records\nWHERE id = 42 AND owner_id = :session_user;\n\nAdmin access → DENY unless separately entitled','Every object and every collection needs a server-side policy. UUIDs do not repair a missing check. Clinical staff access would use an explicit care-team or role policy rather than patient ownership alone.','Authenticated admin → unrelated patient object','Slides 7–9 · BOLA autopsy and patched blueprint'],
 ['The response reveals patient information','HTTP/1.1 200 OK\nContent-Type: application/json\n\n'+JSON.stringify({total:10000,records:[patient],note:'One illustrated record; all data is synthetic'},null,2),'The attacker client receives medical and contact fields. The animated counter shows the bulk impact; the table lets the audience inspect concrete examples. All identities and clinical details here are invented.','Patient database → attacker client','Slides 7, 10–11 · Impact, live demonstration, conclusion']
];

let grid=el('div','',root,'egrid'),a=el('div','',grid,'ebox'),b=el('div','',grid,'ebox');el('h3',view==='attacker'?'Client evidence':view==='portal'?'Browser evidence':'Request / processing evidence',a);
